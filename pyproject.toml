[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "warp-factory-py"
version = "0.1.0"
description = "Numerical spacetime metrics, stress-energy and energy-condition analysis"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "array-api-compat",
    "numpy",
]

[project.optional-dependencies]
cuda = ["cupy-cuda12x>=13"]
directml = ["torch-directml==0.2.5.dev240914"]
release = ["build>=1", "twine>=6"]
plot = ["matplotlib>=3.8"]
test = [
    "pytest>=8",
    "pytest-cov>=5",
]
dev = ["ruff>=0.11"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D"]
# Package markers and small modules do not need redundant docstrings.
ignore = ["D100", "D104", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"examples/**" = ["D"]
"benchmarks/**" = ["D"]
"tools/**" = ["D"]
"count_lines.py" = ["D"]
# Keep the established mathematical keyword argument for compatibility.
"pywarp/solver/utils/get_christoffel_sym.py" = ["E741"]
# Select the optional plotting dependency and backend before importing pyplot.
"tests/visualiser/test_plots.py" = ["D", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
markers = [
    "integration: complete multi-component workflows",
    "numerical: convergence and accuracy checks",
    "parity: comparisons against MATLAB reference data",
    "performance: runtime and memory benchmarks",
    "gpu: opt-in tests requiring a selected physical GPU backend",
    "slow: tests excluded from the default development suite",
]

[tool.setuptools.packages.find]
include = ["pywarp*"]
