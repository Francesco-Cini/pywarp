[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "warp-factory-py"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "array-api-compat",
    "numpy",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
test = [
    "pytest>=8",
    "pytest-cov>=5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
markers = [
    "integration: complete multi-component workflows",
    "numerical: convergence and accuracy checks",
    "parity: comparisons against MATLAB reference data",
    "performance: runtime and memory benchmarks",
    "slow: tests excluded from the default development suite",
]

[tool.setuptools.packages.find]
include = ["pywarp*"]
